<div class="page">

    <!-- Header -->

    <section class="header">

        <button
            mat-icon-button
            (click)="back()">

            <mat-icon>

                arrow_back

            </mat-icon>

        </button>

        <h1>

            {{event?.name}}

        </h1>

    </section>

    <!-- Summary -->

    <section class="summary-container">
    
        <app-summary-card 
        title="Income" 
        icon="trending_up" 
        [amount]="income()" 
        color="green">
        </app-summary-card>
    
        <app-summary-card 
        title="Expense" 
        icon="trending_down" 
        [amount]="expense()" 
        color="red">
        </app-summary-card>
    
        <app-summary-card 
        title="Balance" 
        icon="account_balance_wallet" 
        [amount]="balance()" 
        color="blue">
        </app-summary-card>
    
    </section>

    <!-- Transaction Form -->

    <section>
    
        <app-transaction-form 
        [transaction]="editingTransaction" 
        (add)="addTransaction($event)"
        (update)="updateTransaction($event)" 
        (cancel)="cancelEdit()">
    
        </app-transaction-form>
    
    </section>

    <!-- Search -->

    @if (showToolbar()) {
    
    <div class="toolbar-wrapper" [class.elevated]="toolbarElevated()">
    
        <div class="search-toolbar">
    
            <div class="search-box">
    
                <mat-icon>search</mat-icon>
    
                <input type="text" placeholder="Search name, description or amount" 
                autocomplete="off" [value]="search()"
                (input)="onSearch($event)">
    
            @if(search()){
            
            <button mat-icon-button class="clear-btn" (click)="clearSearch()">
            
                <mat-icon>
            
                    close
            
                </mat-icon>
            
            </button>
            
            }
    
            </div>
            @if (isMobile()) {
            
            <button mat-icon-button class="filter-btn" (click)="openFilter()">
            
                <mat-icon>tune</mat-icon>
            
            </button>
            
            } @else {
            
            <button mat-icon-button class="filter-btn" [matMenuTriggerFor]="filterMenu">
            
                <mat-icon>tune</mat-icon>
            
            </button>
            
            }
    
            <mat-menu #filterMenu="matMenu">
    
                <button mat-menu-item (click)="changeFilter('all')">
    
                    <mat-icon>
    
                        @if(filter() === 'all'){
                        check
                        }
    
                    </mat-icon>
    
                    <span>All</span>
    
                </button>
    
                <button mat-menu-item (click)="changeFilter('income')">
    
                    <mat-icon>
    
                        @if(filter() === 'income'){
                        check
                        }
    
                    </mat-icon>
    
                    <span>Income</span>
    
                </button>
    
                <button mat-menu-item (click)="changeFilter('expense')">
    
                    <mat-icon>
    
                        @if(filter() === 'expense'){
                        check
                        }
    
                    </mat-icon>
    
                    <span>Expense</span>
    
                </button>
    
            </mat-menu>
    
        </div>
    
    </div>
    
    }
    <!-- Transaction List -->

    <section>
    
        <app-transaction-list 
        [transactions]="transactions()" 
        [emptyTitle]="search() || filter() !== 'all'
        ? 'No matching transactions'
        : 'No Transactions Yet'"
        [emptyMessage]="search() || filter() !== 'all'
        ? 'Try another search or clear the filter.'
        : 'Add your first transaction.'"
        (edit)="editTransaction($event)"
        (delete)="deleteTransaction($event)">
        </app-transaction-list>
    
    </section>

</div>
