<div class="page">

    <!-- Header -->

    <section class="header">

        <button
            mat-icon-button
            (click)="back()">

            <mat-icon>

                arrow_back

            </mat-icon>

        </button>

        <h1>

            {{event?.name}}

        </h1>

    </section>

    <!-- Summary -->

    <section class="summary-container">
    
        <app-summary-card 
        title="Income" 
        icon="trending_up" 
        [amount]="income()" 
        color="green">
        </app-summary-card>
    
        <app-summary-card 
        title="Expense" 
        icon="trending_down" 
        [amount]="expense()" 
        color="red">
        </app-summary-card>
    
        <app-summary-card 
        title="Balance" 
        icon="account_balance_wallet" 
        [amount]="balance()" 
        color="blue">
        </app-summary-card>
    
    </section>

    <!-- Transaction Form -->

    <section>
    
        <app-transaction-form 
        [transaction]="editingTransaction" 
        (add)="addTransaction($event)"
        (update)="updateTransaction($event)" 
        (cancel)="cancelEdit()">
    
        </app-transaction-form>
    
    </section>

    <!-- Search -->

    @if (showToolbar()) {
    
    <div class="toolbar-wrapper" [class.elevated]="toolbarElevated()">
    
        <div class="search-toolbar">
    
            <div class="search-box">
    
                <mat-icon>search</mat-icon>
    
                <input type="text" placeholder="Search name, description or amount" 
                autocomplete="off" [value]="search()"
                (input)="onSearch($event)">
    
            @if(search()){
            
            <button mat-icon-button class="clear-btn" (click)="clearSearch()">
            
                <mat-icon>
            
                    close
            
                </mat-icon>
            
            </button>
            
            }
    
            </div>
            @if (isMobile()) {
            
            <button mat-icon-button class="filter-btn" (click)="openFilter()"
            [class.active]="typeFilter() !== 'all' || dateFilter() !== 'all'">
            
                <mat-icon>tune</mat-icon>
            
            </button>
            
            } @else {
            
            <button mat-icon-button class="filter-btn" [matMenuTriggerFor]="filterMenu"
            [class.active]="typeFilter() !== 'all' || dateFilter() !== 'all'">
            
                <mat-icon>tune</mat-icon>
            
            </button>
            
            }
    
        <!-- Desktop Menu -->

        <mat-menu #filterMenu="matMenu">

            <!-- Type -->

            <div class="menu-title">Type</div>

            <button mat-menu-item (click)="changeTypeFilter('all')">

                <mat-icon>
                    @if (typeFilter() === 'all') { check }
                </mat-icon>

                <span>All</span>

            </button>

            <button mat-menu-item (click)="changeTypeFilter('income')">

                <mat-icon>
                    @if (typeFilter() === 'income') { check }
                </mat-icon>

                <span>Income</span>

            </button>

            <button mat-menu-item (click)="changeTypeFilter('expense')">

                <mat-icon>
                    @if (typeFilter() === 'expense') { check }
                </mat-icon>

                <span>Expense</span>

            </button>

            <mat-divider></mat-divider>

            <!-- Date -->

            <div class="menu-title">Date</div>

            <button mat-menu-item (click)="changeDateFilter('all')">

                <mat-icon>
                    @if (dateFilter() === 'all') { check }
                </mat-icon>

                <span>All Dates</span>

            </button>

            <button mat-menu-item (click)="changeDateFilter('today')">

                <mat-icon>
                    @if (dateFilter() === 'today') { check }
                </mat-icon>

                <span>Today</span>

            </button>

            <button mat-menu-item (click)="changeDateFilter('yesterday')">

                <mat-icon>
                    @if (dateFilter() === 'yesterday') { check }
                </mat-icon>

                <span>Yesterday</span>

            </button>

        </mat-menu>
    
        </div>
    
    </div>
    
    }
    <!-- Transaction List -->

    <section>
    
        <app-transaction-list 
        [transactions]="transactions()" 
        [emptyTitle]="search() || typeFilter() !== 'all' || dateFilter() !== 'all'
        ? 'No matching transactions'
        : 'No Transactions Yet'"
        [emptyMessage]="search() || typeFilter() !== 'all' || dateFilter() !== 'all'
        ? 'Try another search or clear the filter.'
        : 'Add your first transaction.'"
        (edit)="editTransaction($event)"
        (delete)="deleteTransaction($event)">
        </app-transaction-list>
    
    </section>

</div>
